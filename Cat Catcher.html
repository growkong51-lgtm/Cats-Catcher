<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Catcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9efe3;--ink:#1f3a36;--card:#f7f9f2;--accent:#e8913a;--onaccent:#2a1a05;--mute:#5f7a73;--line:#cfdac8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15221f;--ink:#e4ece6;--card:#1f302c;--accent:#f0a255;--mute:#8fa89f;--line:#2e443e}}
:root[data-theme="dark"]{--bg:#15221f;--ink:#e4ece6;--card:#1f302c;--accent:#f0a255;--mute:#8fa89f;--line:#2e443e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;line-height:1}
.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px;font:600 1rem inherit;font-family:inherit;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cat img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cat .t{padding:8px 10px 10px}
.cat b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat small{color:var(--mute)}
.empty{text-align:center;padding:48px 12px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--onaccent);border:0;border-radius:999px;padding:16px 28px;font:800 1.1rem inherit;font-family:inherit;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.map{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;display:block}
.hint{color:var(--mute);font-size:.9rem;margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(10,20,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel img{width:100%;max-height:50vh;object-fit:cover;border-radius:12px;display:block}
.panel input{width:100%;padding:12px;margin:12px 0 6px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem inherit;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none}
.btn.p{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.d{color:#c0392b}
.meta{color:var(--mute);font-size:.95rem;margin:8px 0 0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="count">0 cats</h1>
  <p class="sub">Every cat you've found in town.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true">Collection</button>
    <button role="tab" id="t2" aria-selected="false">Map</button>
  </div>
  <div id="view"></div>
</main>
<button class="fab" id="fab">Capture a cat</button>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var cats=[],db=null,tab='list';

function openDB(){return new Promise(function(res){try{var r=indexedDB.open('cat-catcher',1);r.onupgradeneeded=function(){r.result.createObjectStore('cats',{keyPath:'id'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function loadAll(){return new Promise(function(res){if(!db)return res([]);try{var q=db.transaction('cats').objectStore('cats').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})}
function put(c){return new Promise(function(res){if(!db)return res(false);try{var t=db.transaction('cats','readwrite');t.objectStore('cats').put(c);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)}}catch(e){res(false)}})}
function rem(id){return new Promise(function(res){if(!db)return res();try{var t=db.transaction('cats','readwrite');t.objectStore('cats').delete(id);t.oncomplete=res;t.onerror=res}catch(e){res()}})}

function el(tag,props,kids){var e=document.createElement(tag);for(var k in (props||{})){if(k==='text')e.textContent=props[k];else if(k==='on')for(var ev in props.on)e.addEventListener(ev,props.on[ev]);else e.setAttribute(k,props[k])}(kids||[]).forEach(function(c){e.appendChild(c)});return e}
function fmt(t){try{return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return ''}}
function mapsUrl(c){return 'https://www.google.com/maps?q='+c.lat+','+c.lng}

function render(){
  $('#count').textContent=cats.length+(cats.length===1?' cat':' cats');
  $('#t1').setAttribute('aria-selected',tab==='list');$('#t2').setAttribute('aria-selected',tab==='map');
  var v=$('#view');v.innerHTML='';
  if(!cats.length){v.appendChild(el('div',{class:'empty'},[el('b',{text:'No cats yet'}),el('span',{text:'Tap Capture a cat when you spot one. Its photo and location are saved together.'})]));return}
  if(tab==='list'){
    var g=el('div',{class:'grid'});
    cats.slice().reverse().forEach(function(c){
      g.appendChild(el('button',{class:'cat',on:{click:function(){detail(c)}}},[
        el('img',{src:c.photo,alt:c.name}),
        el('div',{class:'t'},[el('b',{text:c.name}),el('small',{text:'#'+c.n+' · '+fmt(c.time)})])]));
    });
    v.appendChild(g);
  } else mapView(v);
}

function mapView(v){
  var L=cats.filter(function(c){return c.lat!=null});
  if(!L.length){v.appendChild(el('div',{class:'empty'},[el('b',{text:'No locations yet'}),el('span',{text:'Cats saved with a location show up here.'})]));return}
  var ns='http://www.w3.org/2000/svg',S=360;
  var svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+S+' '+S);svg.setAttribute('class','map');
  var lat0=L.reduce(function(a,c){return a+c.lat},0)/L.length,k=Math.cos(lat0*Math.PI/180);
  var xs=L.map(function(c){return c.lng*k}),ys=L.map(function(c){return c.lat});
  var minx=Math.min.apply(0,xs),maxx=Math.max.apply(0,xs),miny=Math.min.apply(0,ys),maxy=Math.max.apply(0,ys);
  var span=Math.max(maxx-minx,maxy-miny,0.004),cx=(minx+maxx)/2,cy=(miny+maxy)/2,pad=50,sc=(S-pad*2)/span;
  for(var i=1;i<6;i++){[['x1',i*60,'x2',i*60,'y1',0,'y2',S],['y1',i*60,'y2',i*60,'x1',0,'x2',S]].forEach(function(a){var l=document.createElementNS(ns,'line');for(var j=0;j<a.length;j+=2)l.setAttribute(a[j],a[j+1]);l.setAttribute('stroke','var(--line)');svg.appendChild(l)})}
  L.forEach(function(c){
    var x=S/2+(c.lng*k-cx)*sc,y=S/2-(c.lat-cy)*sc;
    var g=document.createElementNS(ns,'g');g.setAttribute('style','cursor:pointer');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',c.name);
    var o=document.createElementNS(ns,'circle');o.setAttribute('cx',x);o.setAttribute('cy',y);o.setAttribute('r',15);o.setAttribute('fill','var(--accent)');
    var t=document.createElementNS(ns,'text');t.setAttribute('x',x);t.setAttribute('y',y+4.5);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','13');t.setAttribute('font-weight','800');t.setAttribute('fill','#2a1a05');t.textContent=c.n;
    g.appendChild(o);g.appendChild(t);
    g.addEventListener('click',function(){detail(c)});g.addEventListener('keydown',function(e){if(e.key==='Enter')detail(c)});
    svg.appendChild(g);
  });
  v.appendChild(svg);
  v.appendChild(el('p',{class:'hint',text:'Pins show where cats are relative to each other. Tap one to see it or open it in Maps.'}));
}

function open(nodes){var p=$('#panel');p.innerHTML='';nodes.forEach(function(n){p.appendChild(n)});$('#sheet').classList.add('on')}
function close(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')close()});

function detail(c){
  var nodes=[el('img',{src:c.photo,alt:c.name}),el('h2',{text:c.name,style:'margin:12px 0 0'}),
    el('p',{class:'meta',text:'Cat #'+c.n+' · caught '+fmt(c.time)})];
  if(c.lat!=null)nodes.push(el('p',{class:'meta',text:'Spot: '+c.lat.toFixed(5)+', '+c.lng.toFixed(5)}));
  else nodes.push(el('p',{class:'meta',text:'No location saved for this one.'}));
  var row=el('div',{class:'row'});
  if(c.lat!=null)row.appendChild(el('a',{class:'btn',href:mapsUrl(c),target:'_blank',rel:'noopener',text:'Open in Maps'}));
  row.appendChild(el('button',{class:'btn d',text:'Delete',on:{click:function(){if(confirm('Delete '+c.name+'?')){rem(c.id).then(function(){cats=cats.filter(function(x){return x.id!==c.id});close();render()})}}}}));
  row.appendChild(el('button',{class:'btn',text:'Close',on:{click:close}}));
  nodes.push(row);open(nodes);
}

function shrink(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var m=800,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))};
  im.onerror=function(){rej()};im.src=u})}

function locate(){return new Promise(function(res){
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:10000})})}

$('#fab').addEventListener('click',function(){$('#file').value='';$('#file').click()});
$('#file').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  var loc={ready:false,v:null},photo=null;
  var status=el('p',{class:'meta',text:'Finding your location...'});
  var name=el('input',{type:'text',placeholder:'Name this cat (optional)',maxlength:'40','aria-label':'Cat name'});
  var save=el('button',{class:'btn p',text:'Save cat'});
  var img=el('img',{alt:'New cat'});
  save.addEventListener('click',function(){
    if(!photo)return;
    var c={id:Date.now(),n:cats.length?Math.max.apply(0,cats.map(function(x){return x.n}))+1:1,name:name.value.trim()||'Unnamed cat',photo:photo,time:Date.now(),lat:loc.v?loc.v.lat:null,lng:loc.v?loc.v.lng:null};
    put(c).then(function(ok){cats.push(c);if(!ok)alert('Saved for now, but this browser could not store it permanently.');close();tab='list';render()});
  });
  open([img,name,status,el('div',{class:'row'},[el('button',{class:'btn',text:'Cancel',on:{click:close}}),save])]);
  shrink(f).then(function(d){photo=d;img.src=d}).catch(function(){status.textContent='Could not read that photo. Try again.'});
  locate().then(function(v){loc.v=v;status.textContent=v?'Location saved with this cat.':'No location found. It will save without one. Allow location access to fix this.'});
});
$('#t1').addEventListener('click',function(){tab='list';render()});
$('#t2').addEventListener('click',function(){tab='map';render()});

openDB().then(function(d){db=d;return loadAll()}).then(function(a){cats=a.sort(function(x,y){return x.id-y.id});render()});
render();
})();
</script>
</body>
</html>
